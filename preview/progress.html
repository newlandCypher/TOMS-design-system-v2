<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div>
    <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px"><span style="color:var(--fg2)">Pushing firmware v4.3.0</span><span class="mono" style="color:var(--fg3)">68%</span></div>
    <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="width:68%;height:100%;background:var(--accent)"></div></div>
  </div>
  <div>
    <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px"><span style="color:var(--fg2)">Diagnostics</span><span class="mono" style="color:var(--fg3)">100%</span></div>
    <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="width:100%;height:100%;background:var(--success)"></div></div>
  </div>
  <div>
    <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px"><span style="color:var(--fg2)">Indeterminate</span></div>
    <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;position:relative"><div style="width:30%;height:100%;background:var(--accent);animation:slide 1.5s linear infinite"></div></div>
  </div>
  <style>@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(330%)}}</style></div></body></html>
