<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div class="overline">toggle group · multi-select</div>
  <div style="display:inline-flex;border:1px solid var(--border-2);border-radius:6px;overflow:hidden;background:var(--bg2)">
    <button style="height:30px;padding:0 12px;background:var(--bg-active);border:0;border-right:1px solid var(--border-2);font-size:12.5px;font-weight:500;color:var(--fg1);font-family:var(--font-sans)">Cellular</button><button style="height:30px;padding:0 12px;background:var(--bg-active);border:0;border-right:1px solid var(--border-2);font-size:12.5px;font-weight:500;color:var(--fg1);font-family:var(--font-sans)">WiFi</button><button style="height:30px;padding:0 12px;background:transparent;border:0;border-right:1px solid var(--border-2);font-size:12.5px;font-weight:400;color:var(--fg2);font-family:var(--font-sans)">VPN</button><button style="height:30px;padding:0 12px;background:transparent;border:0;font-size:12.5px;font-weight:400;color:var(--fg2);font-family:var(--font-sans)">GPS</button>
  </div>
  <div class="overline">single-select</div>
  <div style="display:inline-flex;border:1px solid var(--border-2);border-radius:6px;overflow:hidden;background:var(--bg2)">
    <button style="height:30px;padding:0 12px;background:transparent;border:0;border-right:1px solid var(--border-2);font-size:12.5px;color:var(--fg2);font-weight:400;font-family:var(--font-sans)">Left</button><button style="height:30px;padding:0 12px;background:var(--bg-active);border:0;border-right:1px solid var(--border-2);font-size:12.5px;color:var(--fg1);font-weight:500;font-family:var(--font-sans)">Center</button><button style="height:30px;padding:0 12px;background:transparent;border:0;font-size:12.5px;color:var(--fg2);font-weight:400;font-family:var(--font-sans)">Right</button>
  </div></div></body></html>
