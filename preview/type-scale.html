<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card tight">
  <div class="overline">type scale · geist sans</div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:8px 14px;align-items:baseline">
    <span class="tag">36</span><span class="tag">4xl</span><span style="font-size:36px;font-weight:500;letter-spacing:-0.02em;color:var(--fg1)">Hero numerals</span>
    <span class="tag">28</span><span class="tag">3xl</span><span style="font-size:28px;font-weight:600;letter-spacing:-0.015em;color:var(--fg1)">Page titles</span>
    <span class="tag">22</span><span class="tag">2xl</span><span style="font-size:22px;font-weight:600;letter-spacing:-0.01em;color:var(--fg1)">Section headers</span>
    <span class="tag">18</span><span class="tag">xl</span><span style="font-size:18px;font-weight:600;color:var(--fg1)">Subsection</span>
    <span class="tag">16</span><span class="tag">lg</span><span style="font-size:16px;font-weight:500;color:var(--fg1)">Card titles</span>
    <span class="tag">14</span><span class="tag">md</span><span style="font-size:14px;color:var(--fg1)">Body — base</span>
    <span class="tag">13</span><span class="tag">sm</span><span style="font-size:13px;color:var(--fg2)">Dense rows</span>
    <span class="tag">12</span><span class="tag">xs</span><span style="font-size:12px;color:var(--fg3)">Captions, hints</span>
  </div>
</div></body></html>
