<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div style="background:var(--bg2);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-4);width:220px;padding:4px">
    <div style="padding:7px 10px;font-size:12.5px;border-radius:5px;display:flex;justify-content:space-between;align-items:center">View details<kbd>↵</kbd></div>
