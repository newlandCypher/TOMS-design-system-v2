<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:8px"><span style="color:var(--fg2)">Brightness</span><span class="mono" style="color:var(--fg3)">72%</span></div>
      <div style="position:relative;height:6px;background:var(--bg3);border-radius:3px"><div style="width:72%;height:100%;background:var(--accent);border-radius:3px"></div><div style="position:absolute;left:72%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--bg2);border:1px solid var(--border-3);transform:translate(-50%,-50%);box-shadow:var(--shadow-1)"></div></div></div>
    <div><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:8px"><span style="color:var(--fg2)">Volume</span><span class="mono" style="color:var(--fg3)">45%</span></div>
      <div style="position:relative;height:6px;background:var(--bg3);border-radius:3px"><div style="width:45%;height:100%;background:var(--accent);border-radius:3px"></div><div style="position:absolute;left:45%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--bg2);border:1px solid var(--border-3);transform:translate(-50%,-50%);box-shadow:var(--shadow-1)"></div></div></div>
  </div></div></body></html>
