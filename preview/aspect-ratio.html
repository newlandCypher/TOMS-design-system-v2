<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div class="overline">aspect ratio</div>
  <div class="row" style="gap:12px;align-items:flex-end">
    <div><div style="width:160px;aspect-ratio:16/9;background:var(--bg3);border:1px solid var(--border-1);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-family:var(--font-mono);font-size:11px">16 : 9</div><div class="caption" style="margin-top:4px">video / map</div></div>
    <div><div style="width:120px;aspect-ratio:4/3;background:var(--bg3);border:1px solid var(--border-1);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-family:var(--font-mono);font-size:11px">4 : 3</div><div class="caption" style="margin-top:4px">card image</div></div>
    <div><div style="width:80px;aspect-ratio:1/1;background:var(--bg3);border:1px solid var(--border-1);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-family:var(--font-mono);font-size:11px">1 : 1</div><div class="caption" style="margin-top:4px">avatar</div></div>
  </div></div></body></html>
