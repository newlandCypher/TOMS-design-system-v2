<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div class="overline">resizable · split panes</div>
  <div style="display:flex;height:120px;border:1px solid var(--border-1);border-radius:8px;overflow:hidden">
    <div style="flex:0 0 35%;background:var(--bg3);padding:10px;font-size:11.5px;color:var(--fg2)">Sidebar · 35%</div>

  </div></div></body></html>
