<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="overline">surfaces · text · borders</div>
  <div class="grid-3">
    <div><div class="swatch__chip" style="background:var(--bg1);border:1px solid var(--border-1);height:48px"></div><span class="swatch__name" style="margin-top:6px;display:block">--bg1 · canvas</span><span class="swatch__val">app background</span></div>
    <div><div class="swatch__chip" style="background:var(--bg2);box-shadow:var(--shadow-2);height:48px"></div><span class="swatch__name" style="margin-top:6px;display:block">--bg2 · surface</span><span class="swatch__val">cards, modals</span></div>
    <div><div class="swatch__chip" style="background:var(--bg3);border:1px solid var(--border-1);height:48px"></div><span class="swatch__name" style="margin-top:6px;display:block">--bg3 · sunken</span><span class="swatch__val">sidebars, code</span></div>
  </div>
  <div class="row" style="gap:18px;flex-wrap:wrap">
    <span style="font-family:var(--font-mono);font-size:11px"><span style="color:var(--fg1)">●</span> fg1 primary</span>
    <span style="font-family:var(--font-mono);font-size:11px"><span style="color:var(--fg2)">●</span> fg2 secondary</span>
    <span style="font-family:var(--font-mono);font-size:11px"><span style="color:var(--fg3)">●</span> fg3 tertiary</span>
    <span style="font-family:var(--font-mono);font-size:11px"><span style="color:var(--fg4)">●</span> fg4 quaternary</span>
  </div>
  <div class="grid-3">
    <div style="height:1px;background:var(--border-1)"></div>
    <div style="height:1px;background:var(--border-2)"></div>
    <div style="height:1px;background:var(--border-3)"></div>
  </div>
  <div class="grid-3">
    <span class="swatch__val">border-1 subtle</span>
    <span class="swatch__val">border-2 default</span>
    <span class="swatch__val">border-3 strong</span>
  </div>
</div></body></html>
