<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div class="row" style="gap:24px;align-items:center">
    <div class="sp" style="--s:14px"></div>
    <div class="sp" style="--s:18px"></div>
    <div class="sp" style="--s:24px"></div>
    <div class="sp" style="--s:32px;--c:var(--success)"></div>
    <div class="sp" style="--s:18px;--c:#fff;background:var(--accent);width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center"></div>
  </div>
  <style>.sp{width:var(--s,16px);height:var(--s,16px);border:2px solid currentColor;border-right-color:transparent;border-radius:50%;color:var(--c,var(--accent));animation:tds-spin .7s linear infinite}@keyframes tds-spin{to{transform:rotate(360deg)}}</style></div></body></html>
