<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body><div class="card tight">
  <div class="tds-card" style="width:620px">
    <div class="tds-card__header">
      <div class="tds-card__title">Battery health</div>
      <span class="tds-badge tds-badge--success">Healthy</span>
    </div>
    <div class="tds-card__body">
      <div style="display:flex;align-items:baseline;gap:12px">
        <span style="font-family:var(--font-mono);font-size:36px;font-weight:500;letter-spacing:-0.02em;color:var(--fg1)">86%</span>
        <span class="overline" style="color:var(--success)">↑ 4.2%</span>
        <span class="caption">vs. last week</span>
      </div>
      <div class="caption" style="margin-top:8px">228 cycles · 12.4 mo since deploy · forecast end-of-life Q4 2027</div>
    </div>
    <div class="tds-card__footer" style="display:flex;justify-content:space-between;align-items:center">
      <span class="caption">Last sample · 12s ago</span>
      <button class="tds-btn tds-btn--sm tds-btn--ghost">View plan →</button>
    </div>
  </div>
</div></body></html>
