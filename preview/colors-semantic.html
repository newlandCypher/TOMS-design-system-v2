<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="overline">semantic · success · warning · error · info</div>
  <div class="grid-4">
    <div><div class="swatch__chip" style="background:var(--success);height:40px"></div><div class="swatch__name" style="margin-top:6px">success 500</div></div>
    <div><div class="swatch__chip" style="background:var(--warning);height:40px"></div><div class="swatch__name" style="margin-top:6px">warning 500</div></div>
    <div><div class="swatch__chip" style="background:var(--error);height:40px"></div><div class="swatch__name" style="margin-top:6px">error 500</div></div>
    <div><div class="swatch__chip" style="background:var(--info);height:40px"></div><div class="swatch__name" style="margin-top:6px">info 500</div></div>
  </div>
  <div class="grid-4">
    <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;background:var(--success-bg);color:var(--color-success-700);border:1px solid oklch(58% 0.14 152 / 0.25);border-radius:9999px;font-size:11px;font-weight:500"><span style="width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-bg)"></span>Online</span>
    <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;background:var(--warning-bg);color:var(--color-warning-700);border:1px solid oklch(70% 0.16 70 / 0.25);border-radius:9999px;font-size:11px;font-weight:500"><span style="width:6px;height:6px;border-radius:50%;background:var(--warning)"></span>Update</span>
    <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;background:var(--error-bg);color:var(--color-error-700);border:1px solid oklch(58% 0.20 25 / 0.25);border-radius:9999px;font-size:11px;font-weight:500"><span style="width:6px;height:6px;border-radius:50%;background:var(--error)"></span>Offline</span>
    <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;background:var(--info-bg);color:var(--color-info-700);border:1px solid oklch(60% 0.14 230 / 0.25);border-radius:9999px;font-size:11px;font-weight:500"><span style="width:6px;height:6px;border-radius:50%;background:var(--info)"></span>Syncing</span>
  </div>
</div></body></html>
