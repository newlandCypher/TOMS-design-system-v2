<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="overline">corner radii</div>
  <div class="row" style="gap:20px;align-items:flex-end">
    <div class="col" style="align-items:center"><div style="width:64px;height:48px;background:var(--bg2);border:1px solid var(--border-2);border-radius:2px"></div><span class="swatch__name">sm · 2</span></div>
    <div class="col" style="align-items:center"><div style="width:64px;height:48px;background:var(--bg2);border:1px solid var(--border-2);border-radius:4px"></div><span class="swatch__name">md · 4</span></div>
    <div class="col" style="align-items:center"><div style="width:64px;height:48px;background:var(--bg2);border:1px solid var(--border-2);border-radius:6px"></div><span class="swatch__name">lg · 6 ◀ buttons</span></div>
    <div class="col" style="align-items:center"><div style="width:64px;height:48px;background:var(--bg2);border:1px solid var(--border-2);border-radius:8px"></div><span class="swatch__name">xl · 8</span></div>
    <div class="col" style="align-items:center"><div style="width:64px;height:48px;background:var(--bg2);border:1px solid var(--border-2);border-radius:12px"></div><span class="swatch__name">2xl · 12 ◀ cards</span></div>
    <div class="col" style="align-items:center"><div style="width:64px;height:48px;background:var(--bg2);border:1px solid var(--border-2);border-radius:9999px"></div><span class="swatch__name">full ◀ pills</span></div>
  </div>
</div></body></html>
