<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body><div class="card">
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <span class="tds-badge tds-badge--neutral">Draft</span>
    <span class="tds-badge tds-badge--info">Syncing</span>
    <span class="tds-badge tds-badge--success">Online</span>
    <span class="tds-badge tds-badge--warning">Update available</span>
    <span class="tds-badge tds-badge--error">Offline</span>
  </div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <span class="tds-badge tds-badge--success"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Healthy</span>
    <span class="tds-badge tds-badge--warning"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Degraded · LTE</span>
    <span class="tds-badge tds-badge--error"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Lost connection</span>
    <span class="tds-badge tds-badge--info"><span style="width:5px;height:5px;border-radius:50%;background:currentColor"></span>Pending OTA</span>
  </div>
  <div class="caption">Always rounded-full · 11px · medium · tone-bg + tone-fg. Optional 5px tone dot at left.</div>
</div></body></html>
