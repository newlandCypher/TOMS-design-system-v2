<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body><div class="card">
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <button class="tds-btn tds-btn--md tds-btn--primary">Push command</button>
    <button class="tds-btn tds-btn--md tds-btn--secondary">Refresh</button>
    <button class="tds-btn tds-btn--md tds-btn--ghost">Cancel</button>
    <button class="tds-btn tds-btn--md tds-btn--danger">Delete terminal</button>
    <button class="tds-btn tds-btn--md tds-btn--link">View plan →</button>
  </div>
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <button class="tds-btn tds-btn--sm tds-btn--primary">Small</button>
    <button class="tds-btn tds-btn--md tds-btn--primary">Medium</button>
    <button class="tds-btn tds-btn--lg tds-btn--primary">Large</button>
    <button class="tds-btn tds-btn--md tds-btn--primary"><span class="tds-btn__spinner"></span>Pushing…</button>
    <button class="tds-btn tds-btn--md tds-btn--primary" disabled>Disabled</button>
  </div>
  <div class="caption">Primary uses --shadow-cta. Hover → -100 step, active → +100 step. Verb-first labels, Title Case.</div>
</div></body></html>
