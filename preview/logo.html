<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:32px;align-items:center">
    <div class="col" style="gap:8px;align-items:center">
      <div style="background:var(--bg2);padding:14px;border:1px solid var(--border-1);border-radius:12px"><img src="../assets/toms-logo.png" alt="" width="56" height="56" style="display:block" /></div>
      <span class="swatch__name">Mark · 22–56 px</span>
    </div>
    <div class="col" style="gap:8px;align-items:center">
      <div style="background:var(--bg2);padding:14px 22px;border:1px solid var(--border-1);border-radius:12px"><img src="../assets/toms-wordmark.png" alt="" height="32" style="display:block" /></div>
      <span class="swatch__name">Wordmark · marketing</span>
    </div>
    <div class="col" style="gap:8px;align-items:center">
      <div style="background:var(--color-brand-mono);padding:14px;border-radius:12px"><img src="../assets/toms-logo.png" alt="" width="56" height="56" style="display:block;filter:invert(1)" /></div>
      <span class="swatch__name">Inverse · brand-mono</span>
    </div>
  </div>
  <div class="caption">Lockup uses --color-brand-mono (≈ oklch(22%) ) — darker than CTA. Square mark sits on bg2 in the sidebar; wordmark on marketing surfaces only.</div>
</div></body></html>
