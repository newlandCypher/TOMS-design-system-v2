<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card tight">
  <div class="overline">primary · midnight indigo · CTA</div>
  <div class="grid-6">
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-50)"></div><span class="swatch__name">primary 50</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-100)"></div><span class="swatch__name">primary 100</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-200)"></div><span class="swatch__name">primary 200</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-300)"></div><span class="swatch__name">primary 300</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-400)"></div><span class="swatch__name">primary 400</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-500)"></div><span class="swatch__name">primary 500</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-600)"></div><span class="swatch__name">primary 600</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-700);box-shadow:0 0 0 2px var(--accent) inset, 0 0 0 4px var(--bg1)"></div><span class="swatch__name">primary 700 ◀ CTA</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-800)"></div><span class="swatch__name">primary 800</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-primary-900)"></div><span class="swatch__name">primary 900</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-brand-mono)"></div><span class="swatch__name">brand mono</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-brand-mono-soft)"></div><span class="swatch__name">brand mono soft</span></div>
  </div>
  <div class="caption">Default: primary-700. Hover → 600. Active → 800. Use sparingly: one CTA per surface.</div>
</div></body></html>
