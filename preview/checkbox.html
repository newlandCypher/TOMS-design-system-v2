<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div class="row" style="gap:18px;flex-wrap:wrap">
    <label class="tds-checkbox"><input type="checkbox" /><span class="tds-checkbox__box"></span>Off</label>
    <label class="tds-checkbox"><input type="checkbox" checked /><span class="tds-checkbox__box"><svg class="tds-checkbox__check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.5 5 9l4.5-5"/></svg></span>On</label>
    <label class="tds-checkbox"><input type="checkbox" /><span class="tds-checkbox__box" style="background:var(--accent);border-color:var(--accent)"><span style="display:block;width:8px;height:2px;background:#fff;border-radius:1px"></span></span>Indeterminate</label>
    <label class="tds-checkbox" style="opacity:.5"><input type="checkbox" disabled /><span class="tds-checkbox__box"></span>Disabled</label>
  </div></div></body></html>
