<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="overline">elevation · 5 levels + cta + focus</div>
  <div class="grid-5" style="padding:20px 8px;background:var(--bg1)">
    <div class="col" style="align-items:center;gap:8px"><div style="width:80px;height:50px;background:var(--bg2);border:1px solid var(--border-1);border-radius:8px;box-shadow:var(--shadow-1)"></div><span class="swatch__name">1 · hairline</span></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:80px;height:50px;background:var(--bg2);border-radius:8px;box-shadow:var(--shadow-2)"></div><span class="swatch__name">2 · card</span></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:80px;height:50px;background:var(--bg2);border-radius:8px;box-shadow:var(--shadow-3)"></div><span class="swatch__name">3 · popover</span></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:80px;height:50px;background:var(--bg2);border-radius:8px;box-shadow:var(--shadow-4)"></div><span class="swatch__name">4 · menu</span></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:80px;height:50px;background:var(--bg2);border-radius:8px;box-shadow:var(--shadow-5)"></div><span class="swatch__name">5 · modal</span></div>
  </div>
  <div class="row" style="gap:16px">
    <button style="background:var(--accent);color:#fff;border:0;height:32px;padding:0 16px;border-radius:6px;font-family:var(--font-sans);font-size:13px;font-weight:500;box-shadow:var(--shadow-cta)">Push command</button>
    <span class="caption">--shadow-cta · the signature inset+drop+0.5px edge for primary buttons</span>
  </div>
  <div class="row" style="gap:16px">
    <input value="Focused" style="height:32px;padding:0 12px;background:var(--bg2);border:1px solid var(--color-border-focus);border-radius:6px;font-family:var(--font-sans);font-size:13px;color:var(--fg1);box-shadow:var(--shadow-focus);outline:0" />
    <span class="caption">--shadow-focus · 3px halo</span>
  </div>
</div></body></html>
