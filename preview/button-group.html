<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../styles/components.css"></head><body><div class="card">
  <div style="display:inline-flex;border:1px solid var(--border-2);border-radius:6px;overflow:hidden;background:var(--bg2)">
    <button style="height:32px;padding:0 14px;background:var(--bg-active);border:0;border-right:1px solid var(--border-2);font-size:13px;font-weight:500;color:var(--fg1);font-family:var(--font-sans)">Day</button>
    <button style="height:32px;padding:0 14px;background:transparent;border:0;border-right:1px solid var(--border-2);font-size:13px;color:var(--fg2);font-family:var(--font-sans)">Week</button>
    <button style="height:32px;padding:0 14px;background:transparent;border:0;border-right:1px solid var(--border-2);font-size:13px;color:var(--fg2);font-family:var(--font-sans)">Month</button>
    <button style="height:32px;padding:0 14px;background:transparent;border:0;font-size:13px;color:var(--fg2);font-family:var(--font-sans)">Year</button>
  </div>
  <div style="display:inline-flex">
    <button class="tds-btn tds-btn--md tds-btn--secondary" style="border-top-right-radius:0;border-bottom-right-radius:0">Push update</button>
    <button class="tds-btn tds-btn--md tds-btn--secondary" style="border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;width:32px;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div></div></body></html>
