<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card tight">
  <div class="overline">vivid accent · charts + AI sparkles only</div>
  <div class="grid-6">
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-accent-50)"></div><span class="swatch__name">accent 50</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-accent-100)"></div><span class="swatch__name">accent 100</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-accent-200)"></div><span class="swatch__name">accent 200</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-accent-500)"></div><span class="swatch__name">accent 500</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-accent-600)"></div><span class="swatch__name">accent 600</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-accent-700)"></div><span class="swatch__name">accent 700</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#00c1ff"></div><span class="swatch__name">cyan</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#533fdf"></div><span class="swatch__name">indigo</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#5562f5"></div><span class="swatch__name">purple</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--accent-gradient-soft);border:1px dashed var(--border-2)"></div><span class="swatch__name">soft wash</span></div>
  </div>
  <div class="caption">Reserved for chart strokes, the ✦ AI sparkle, and the single soft-wash banner. Not for buttons.</div>
</div></body></html>
