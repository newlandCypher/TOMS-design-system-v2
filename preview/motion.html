<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="overline">motion · durations + easings</div>
  <div class="grid-2" style="gap:16px">
    <div class="col">
      <div class="token-row"><span class="token-row__name">instant</span><span class="token-row__val">80ms</span></div>
      <div class="token-row"><span class="token-row__name">fast</span><span class="token-row__val">120ms ◀ hover</span></div>
      <div class="token-row"><span class="token-row__name">normal</span><span class="token-row__val">200ms ◀ panels</span></div>
      <div class="token-row"><span class="token-row__name">slow</span><span class="token-row__val">320ms ◀ modals</span></div>
    </div>
    <div class="col">
      <div class="token-row"><span class="token-row__name">standard</span><span class="token-row__val">cubic(.2,0,0,1)</span></div>
      <div class="token-row"><span class="token-row__name">emphasized</span><span class="token-row__val">cubic(.3,0,0,1)</span></div>
      <div class="token-row"><span class="token-row__name">decelerate</span><span class="token-row__val">cubic(0,0,0,1)</span></div>
      <div class="token-row"><span class="token-row__name">accelerate</span><span class="token-row__val">cubic(.4,0,1,1)</span></div>
    </div>
  </div>
  <div class="caption">Conservative. Nothing bounces. All durations collapse to 0 under prefers-reduced-motion.</div>
</div></body></html>
